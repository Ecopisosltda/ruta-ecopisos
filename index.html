<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ruta del día · Ecopisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@12.0.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@12.0.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F1EDE6; --surface:#FFFFFF; --surface-2:#EAE4D9; --line:#DAD3C6;
    --ink:#211D18; --muted:#6B655C; --wood:#C9793F; --wood-ink:#2B1706; --brand-green:#3E7A2E;
    --pend:#8B8681; --enruta:#3E7CA6; --hecho:#3E7A2E; --problema:#B23B33; --anulado:#9C978F;
    --pill-retiro:#767676; --atrasado:#B5680E;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17181A; --surface:#202225; --surface-2:#2A2D30; --line:#3A3D40;
      --ink:#EDE9E1; --muted:#9A968D; --wood:#D98A4C; --wood-ink:#1B1204; --brand-green:#63A855;
      --pend:#948F87; --enruta:#5B9BD1; --hecho:#63A855; --problema:#D1615A; --anulado:#6B665F;
      --pill-retiro:#8A8A8A; --atrasado:#D98A32;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181A; --surface:#202225; --surface-2:#2A2D30; --line:#3A3D40;
    --ink:#EDE9E1; --muted:#9A968D; --wood:#D98A4C; --wood-ink:#1B1204; --brand-green:#63A855;
    --pend:#948F87; --enruta:#5B9BD1; --hecho:#63A855; --problema:#D1615A; --anulado:#6B665F;
    --pill-retiro:#8A8A8A; --atrasado:#D98A32;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Archivo',"Arial Narrow",sans-serif; font-weight:700; letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:inherit;}
  .app{max-width:960px;margin:0 auto;padding:0 16px 64px;}
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .topbar .brand{display:flex; align-items:center; gap:8px;}
  .topbar .brand img{height:30px; width:auto; display:block; border-radius:4px;}
  .topbar .brand .name{font-size:15px; color:var(--muted); font-weight:500;}
  .whoami{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);}
  .whoami button{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12.5px;
  }
  .whoami button:hover{color:var(--ink); border-color:var(--muted);}

  /* --- Role picker --- */
  .picker{padding:32px 16px 48px; max-width:520px; margin:0 auto;}
  .picker-logo{display:block; max-width:280px; width:100%; height:auto; margin:0 auto 22px;}
  .picker h1{font-size:26px; margin:0 0 6px; text-align:center;}
  .picker p.sub{color:var(--muted); margin:0 0 32px; font-size:15px; line-height:1.5; text-align:center;}
  .picker-group{margin-bottom:28px;}
  .picker-group .label{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; font-weight:600;}
  .role-btn{
    display:block; width:100%; text-align:left; padding:16px 18px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    cursor:pointer; font-size:15.5px; color:var(--ink); font-weight:600;
  }
  .role-btn:hover{border-color:var(--wood);}
  .role-btn .sub2{display:block; font-weight:400; color:var(--muted); font-size:13px; margin-top:2px;}

  /* --- Tabs --- */
  .tabs{display:flex; gap:4px; padding:12px 0 0; overflow-x:auto; border-bottom:1px solid var(--line);}
  .tab{
    padding:9px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; font-weight:600;
    color:var(--muted); white-space:nowrap; border:1px solid transparent; border-bottom:none;
  }
  .tab.active{color:var(--ink); background:var(--surface); border-color:var(--line);}
  .panel{padding:20px 0 40px;}

  /* --- Forms --- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  input,select,textarea{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:14.5px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:56px;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:8px;
    border:none; cursor:pointer; font-weight:700; font-size:14px;
  }
  .btn-primary{background:var(--wood); color:var(--wood-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-small{padding:6px 10px; font-size:12.5px; border-radius:7px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .helper{font-size:12.5px; color:var(--muted); margin-top:10px;}
  .confirm{
    margin-top:14px; padding:12px 14px; border-radius:8px; background:var(--surface-2);
    border:1px dashed var(--wood); font-size:14px;
  }

  /* --- Ruta de hoy --- */
  .ruta-controls{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px;}
  .ruta-controls > div{min-width:160px;}
  .hist-row:hover{background:var(--bg-soft, rgba(0,0,0,.03));}
  .group{margin-bottom:26px;}
  .group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .group-head h3{margin:0; font-size:15px;}
  .group-head .count{font-size:12.5px; color:var(--muted);}
  .stop{
    display:flex; gap:12px; align-items:flex-start; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
  }
  .tag{
    flex:0 0 auto; font-family:'Archivo',sans-serif; font-weight:800; font-size:15px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-3deg);
  }
  .stop-body{flex:1; min-width:0;}
  .stop-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .pill{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 7px; border-radius:5px; color:#fff;
  }
  .pill-retiro{background:var(--pill-retiro);}
  .pill-entrega{background:var(--wood); color:var(--wood-ink);}
  .estado-badge{font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:20px; color:#fff;}
  .est-Pendiente{background:var(--pend);}
  .est-En-Ruta{background:var(--enruta);}
  .est-Realizado{background:var(--hecho);}
  .est-Con-Problema{background:var(--problema);}
  .est-Anulado{background:var(--anulado); text-decoration:line-through;}
  .badge-atrasado{background:var(--atrasado); color:#fff; text-transform:uppercase; font-weight:800; letter-spacing:.03em; font-size:11px; padding:3px 8px; border-radius:20px;}
  .stop-title{font-weight:700; font-size:15px;}
  .stop-meta{font-size:13px; color:var(--muted); line-height:1.5;}
  .stop-meta a{color:var(--enruta); text-decoration:none; font-weight:600;}
  .stop-actions{display:flex; gap:6px; flex-direction:column; align-items:flex-end;}
  .stop-actions .row{display:flex; gap:4px;}
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1;
  }
  select.mini{padding:5px 6px; font-size:12.5px; width:auto;}
  .empty{color:var(--muted); font-size:14px; padding:20px 0;}

  /* --- Admin lists --- */
  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{color:var(--muted); font-size:12.5px;}

  /* --- Conductor view --- */
  .drv-head{margin:18px 0 20px;}
  .drv-head h2{margin:0 0 2px; font-size:20px;}
  .drv-head .sub{color:var(--muted); font-size:13.5px;}
  .drv-stop{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px;
  }
  .drv-stop .stop-top{margin-bottom:8px;}
  .drv-stop .stop-title{font-size:17px;}
  .drv-stop .stop-meta{font-size:14px; margin-bottom:10px;}
  .drv-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .drv-actions button{
    flex:1; min-width:90px; padding:9px 8px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .drv-actions button.on{border-color:transparent; color:#fff;}
  .drv-actions button.on.Pendiente{background:var(--pend);}
  .drv-actions button.on.En\ Ruta{background:var(--enruta);}
  .drv-actions button.on.Realizado{background:var(--hecho);}
  .drv-actions button.on.Con\ Problema{background:var(--problema);}
  .obs-input{margin-top:8px;}
  .drv-stop-done{
    display:flex; flex-direction:column; gap:3px; padding:9px 12px; margin-bottom:8px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  }
  .drv-stop-done .top-row{display:flex; align-items:center; gap:8px;}
  .drv-stop-done .stop-title-mini{font-weight:600; font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .drv-stop-done .sub-row{font-size:12px; color:var(--muted); padding-left:34px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .banner{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:13.5px; color:var(--muted); margin-bottom:16px;}
  .banner.warn{border-color:var(--problema); color:var(--problema);}

  /* --- Modal edición --- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto;
  }
  .modal{background:var(--surface); border-radius:12px; padding:20px; max-width:560px; width:100%; border:1px solid var(--line);}
  .modal h3{margin:0 0 14px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}

  /* --- Encomiendas --- */
  :root{ --enc:#6A4FA8; }
  .pill-enc{background:var(--enc); color:#fff;}
  .enc-toggle{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:12px;
    border:1px dashed var(--line); border-radius:8px; cursor:pointer; font-weight:600; font-size:14px;}
  .enc-toggle input{width:auto; margin:0;}
  .enc-box{border:1px solid var(--enc); border-radius:10px; padding:14px 14px 4px; margin-bottom:14px;
    background:color-mix(in srgb, var(--enc) 6%, var(--surface));}
  .enc-box h4{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--enc);}
  .solo-normal.oculto, .enc-box.oculto{display:none;}
  .enc-destino{margin-top:6px; padding:8px 10px; border-left:3px solid var(--enc); background:var(--surface-2);
    border-radius:0 6px 6px 0; font-size:13px; color:var(--ink); line-height:1.5;}
  .adj-list{display:flex; flex-direction:column; gap:6px; margin:6px 0 10px;}
  .adj-item{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:7px;}
  .adj-item .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .adj-item .m{color:var(--muted); font-size:12px;}
  .adj-btn{background:none; border:none; color:var(--enruta); font-weight:600; cursor:pointer; padding:0; font-size:13px; text-decoration:none;}
  .adj-btn.gone{color:var(--muted); cursor:default; text-decoration:line-through;}
  .fecha-nav{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .fecha-nav input{width:auto;}
  .fecha-nav .icon-btn{width:34px; height:34px; font-size:14px;}
  .ro-note{font-size:12.5px; color:var(--muted); margin-top:6px;}
</style>
</head>

  // ---------- helpers ----------

  const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayStr = () => {
    const d = new Date(); const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;

  const fmtFechaCorta = (iso) => { try{ const [y,m,d]=iso.split('-'); return `${d}-${m}`; }catch(e){ return iso; } };
  const mapsUrl = (dir, comuna) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((dir||'')+' '+(comuna||''));
  const telUrl = (t) => 'tel:' + String(t||'').replace(/[^0-9+]/g,'');
  const waUrl = (t) => {
    let d = String(t||'').replace(/[^0-9]/g,'').replace(/^0+/,'');

    if(!d.startsWith('56')) d = '56'+d;
    return 'https://wa.me/'+d;
  };
  const ESTADOS = ['Pendiente','En Ruta','Realizado','Con Problema'];

  const SEED_DISTRIBUIDORES = [
    ["pyramid","Pyramid","Domingo Arteaga 509","Macul","Roxana Gomez","2 2238 6646","-33.48135938084283,-70.6153586135655"],

    ["omvdeco-pudahuel","Omv Deco S.A.","Puerto Madero 9710, Bodega D12","Pudahuel","Felipe Meza","9 8819 1601","-33.450259819392464,-70.78572887468641"],

    ["pdq","PDQ Transporte","Av. El Retiro 9301","Renca","","2 2303 8700","-33.39768843279035,-70.76879844724048"],
    ["elroble","El Roble - Decoraciones","Americo Vespucio 526","La Cisterna","Cristina","961598786","-33.53807563293927,-70.65918069999985"],
    ["signet","Signet","Avda Carrascal 6680","Cerro Navia","Ronal Torres","996955867","-33.41337302232021,-70.72050037118147"],

  // Empresas de transporte para encomiendas (hoja "Encomienda")

    ["pdq","PDQ Transporte","Av. El Retiro 9301","Renca","","2 2303 8700","-33.39768843279035,-70.76879844724048"],
    ["tvp-bustamante","TVP Transporte","Av. Gral. Bustamante 656","Nunoa","","9 8735 4212","-33.44997969892261,-70.62929380908791"],

  ];
  // Adjuntos: se guardan en Firestore (colección 'adjuntos'), máx ~700 KB c/u, y se borran solos 2 días después de la fecha de entrega.
  const ADJ_MAX_BYTES = 700*1024;

  const SEED_CONDUCTORES = [

  // ---------- state ----------
  let db = null;
  let unsub = [];
  let state = {

  };

  function loadRole(){
    try{
      const raw = localStorage.getItem('ecopisos_rol');
      if(raw) state.role = JSON.parse(raw);
    }catch(e){}
  }
  function urlRolParam(){
    try{ return new URLSearchParams(window.location.search).get('rol'); }catch(e){ return null; }
  }
  function applyUrlRole(){
    const param = urlRolParam();
    if(!param) return;
    if(param==='despachador'){
      state.role = {type:'despachador'};
      state.rolLocked = true;
    } else {
      const c = byId(state.conductores, param);
      if(c){
        state.role = {type:'conductor', id:c.id, nombre:c.nombre};
        state.rolLocked = true;
      }
    }
  }
  function saveRole(r){
    state.role = r;
    try{ localStorage.setItem('ecopisos_rol', JSON.stringify(r)); }catch(e){}
    render();
  }
  function clearRole(){
    state.role = null;
    try{ localStorage.removeItem('ecopisos_rol'); }catch(e){}
    render();
  }

  function byId(arr,id){ return arr.find(x=>x.id===id); }
  function distNombre(id){ const d=byId(state.distribuidores,id); return d? d.nombre : '(distribuidor)'; }

  // ---------- adjuntos (PDF / Word / imagen) ----------
  function fechaExpiracion(fechaEntrega){
    const ahora48 = Date.now() + ADJ_DIAS*24*3600*1000;
    let t = ahora48;
    if(fechaEntrega){
      const [y,m,d] = fechaEntrega.split('-').map(Number);
      const fin = new Date(y, m-1, d + ADJ_DIAS, 23, 59, 0).getTime();
      t = Math.max(fin, ahora48);
    }
    return new Date(t).toISOString();
  }
  function leerComoDataUrl(blob){
    return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
  }
  async function comprimirImagen(file){
    const url = await leerComoDataUrl(file);
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let w = img.width, h = img.height; const max = 1800;
    if(Math.max(w,h) > max){ const k = max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
    const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    for(const q of [0.82,0.7,0.55,0.4]){
      const b = await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      if(b && b.size <= ADJ_MAX_BYTES) return {blob:b, nombre:file.name.replace(/\.[^.]+$/,'')+'.jpg', tipo:'image/jpeg'};
    }
    return null;
  }
  // valida y prepara archivos; devuelve {ok:[{blob,nombre,tipo}], errores:[texto]}
  async function prepararArchivos(files){
    const ok = [], errores = [];
    for(const f of files){
      const esImg = /^image\//.test(f.type);
      const esDoc = /\.(pdf|docx?|png|jpe?g|webp|heic)$/i.test(f.name) || esImg || /pdf|word|officedocument/.test(f.type);
      if(!esDoc){ errores.push(f.name+': formato no permitido (usa PDF, Word o imagen).'); continue; }
      if(f.size <= ADJ_MAX_BYTES){ ok.push({blob:f, nombre:f.name, tipo:f.type||'application/octet-stream'}); continue; }
      if(esImg){
        const c = await comprimirImagen(f).catch(()=>null);
        if(c){ ok.push(c); continue; }
      }
      errores.push(f.name+' pesa '+fmtBytes(f.size)+': el máximo es 700 KB.');
    }
    return {ok, errores};
  }
  async function subirAdjuntos(pedidoId, fechaEntrega, archivos){

      const dataUrl = await leerComoDataUrl(a.blob);

      const ref = db.collection('adjuntos').doc();
      await ref.set({pedidoId, nombre:a.nombre, tipo:a.tipo, tam:a.blob.size, data:dataUrl, creadoEn:new Date().toISOString(), expiraEn});
      metas.push({id:ref.id, nombre:a.nombre, tipo:a.tipo, tam:a.blob.size, expiraEn});
    }
    return metas;
  }

  function nextOrderForConductorDay(conductorId, fecha){

        if(typeof p.ordenRetiro==='number') max = Math.max(max,p.ordenRetiro);

  function legNoFinalizado(estado){
    return estado==='Pendiente' || estado==='En Ruta';
  }
  function legsForConductorDay(conductorId, fecha){
    const esHoy = fecha === todayStr();
    const legs = [];
    state.pedidos.forEach(p=>{
      if((p.conductorId||'')!==conductorId) return;
      const mismaFecha = p.fecha === fecha;
      const esAtrasado = esHoy && p.fecha < fecha;
      if(!mismaFecha && !esAtrasado) return;

      if(mismaFecha || (esAtrasado && legNoFinalizado(p.estadoRetiro))){
        legs.push({pedido:p, tipo:'RETIRO', orden: typeof p.ordenRetiro==='number'?p.ordenRetiro:9999,
          estado:p.estadoRetiro, obs:p.obsRetiro, atrasado: esAtrasado && !mismaFecha});
      }
      if(mismaFecha || (esAtrasado && legNoFinalizado(p.estadoEntrega))){
        legs.push({pedido:p, tipo:'ENTREGA', orden: typeof p.ordenEntrega==='number'?p.ordenEntrega:9999,
          estado:p.estadoEntrega, obs:p.obsEntrega, atrasado: esAtrasado && !mismaFecha});
      }
    });
    legs.sort((a,b)=> (a.atrasado===b.atrasado) ? a.orden-b.orden : (a.atrasado ? -1 : 1));
    return legs;
  }
  function legsValid(legs){
    const pos = {};
    legs.forEach((l,i)=>{ (pos[l.pedido.id]=pos[l.pedido.id]||{})[l.tipo]=i; });
    return Object.values(pos).every(p => !(p.RETIRO!=null && p.ENTREGA!=null) || p.RETIRO < p.ENTREGA);
  }
  function invalidPedidoIds(legs){
    const pos = {}; const bad = new Set();
    legs.forEach((l,i)=>{ (pos[l.pedido.id]=pos[l.pedido.id]||{})[l.tipo]=i; });
    Object.entries(pos).forEach(([pid,p])=>{ if(p.RETIRO!=null && p.ENTREGA!=null && p.RETIRO>=p.ENTREGA) bad.add(pid); });
    return bad;
  }
  const COMUNA_PALETTE = ['#A85F2C','#3E7CA6','#4F8542','#8B5FA8','#B23B33','#5B7A87','#A8862C','#6A6FB2'];
  const comunaColorCache = {};
  function comunaColor(comuna){
    if(!comuna) return '#9C978F';
    if(!comunaColorCache[comuna]){
      let h=0; for(let i=0;i<comuna.length;i++) h = (h*31 + comuna.charCodeAt(i))>>>0;
      comunaColorCache[comuna] = COMUNA_PALETTE[h % COMUNA_PALETTE.length];
    }
    return comunaColorCache[comuna];
  }
  function comunaDeLeg(l){
    return l.tipo==='RETIRO' ? (distComuna(l.pedido.distribuidorId)||'') : (entregaDe(l.pedido).comuna||'');
  }
  function rutaMapsUrl(legs){
    const puntos = legs.map(l=>{
      if(l.tipo==='RETIRO'){
        const d = byId(state.distribuidores, l.pedido.distribuidorId);
        if(!d) return '';
        return d.coords ? d.coords : (d.direccion+', '+d.comuna);
      }
      const e = entregaDe(l.pedido);
      return e.coords ? e.coords : ((e.direccion||'')+', '+(e.comuna||''));
    }).filter(Boolean);
    if(puntos.length<2) return null;
    const origin = puntos[0], destination = puntos[puntos.length-1], waypoints = puntos.slice(1,-1);
    let url = 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination);
    if(waypoints.length) url += '&waypoints='+waypoints.map(encodeURIComponent).join('%7C');
    return url;
  }
  function repararOrdenRetiroAntesQueEntrega(legs){
    const result = []; const placedRetiro = new Set(); const pending = legs.slice();
    while(pending.length){
      const l = pending.shift();
      if(l.tipo==='ENTREGA' && !placedRetiro.has(l.pedido.id)){
        const idx = pending.findIndex(x=>x.pedido.id===l.pedido.id && x.tipo==='RETIRO');
        if(idx>=0){ const [ret] = pending.splice(idx,1); result.push(ret); placedRetiro.add(l.pedido.id); }
        result.push(l);
      } else {
        if(l.tipo==='RETIRO') placedRetiro.add(l.pedido.id);
        result.push(l);
      }
    }
    return result;
  }
  async function ordenarPorComuna(conductorId, fecha){
    let legs = legsForConductorDay(conductorId, fecha);
    if(legs.length<2) return;
    const orderSeen = [];
    legs.forEach(l=>{ const c=comunaDeLeg(l); if(!orderSeen.includes(c)) orderSeen.push(c); });
    legs = legs.slice().sort((a,b)=>{
      const ca=orderSeen.indexOf(comunaDeLeg(a)), cb=orderSeen.indexOf(comunaDeLeg(b));
      if(ca!==cb) return ca-cb;
      return a.pedido.numero-b.pedido.numero;
    });
    legs = repararOrdenRetiroAntesQueEntrega(legs);
    await guardarOrdenLegs(legs);
  }
  async function moverLeg(conductorId, fecha, idx, dir){
    const legs = legsForConductorDay(conductorId, fecha);
    const j = idx+dir;
    if(j<0||j>=legs.length) return;
    const sim = legs.slice();
    const tmp = sim[idx]; sim[idx]=sim[j]; sim[j]=tmp;
    if(!legsValid(sim)){
      customAlert('No se puede: la entrega quedaría antes que su propio retiro.');
      return;
    }
    await guardarOrdenLegs(sim);
  }
  // Renumera 1..n toda la ruta en el orden dado (funciona aunque los pedidos no tuvieran orden previo)
  async function guardarOrdenLegs(legs){
    const upd = {};
    legs.forEach((l,i)=>{
      const field = l.tipo==='RETIRO'?'ordenRetiro':'ordenEntrega';
      const cur = l.tipo==='RETIRO' ? l.pedido.ordenRetiro : l.pedido.ordenEntrega;
      if(cur !== i+1) (upd[l.pedido.id] = upd[l.pedido.id] || {})[field] = i+1;
    });
    const ids = Object.keys(upd);
    if(!ids.length) return;
    // actualización optimista para que la flecha responda al instante
    ids.forEach(id=>{ const p = byId(state.pedidos,id); if(p) Object.assign(p, upd[id]); });
    render();
    const batch = db.batch();
    ids.forEach(id=> batch.update(db.doc('pedidos/'+id), upd[id]));
    await batch.commit();
  }

      Array.from(f.elements).forEach(el=>{
        if(!el.name || el.type==='file' || el.type==='submit' || el.type==='button') return;
        vals[el.name] = el.type==='checkbox' ? el.checked : el.value;
      });
      state.formDrafts[fid] = vals;
      if(act && act.form===f && act.name){
        let sel = null; try{ sel = [act.selectionStart, act.selectionEnd]; }catch(e){}
        state._foco = {fid, name:act.name, sel};
      }
    });
  }
  function restaurarBorradores(){
    FORMS_BORRADOR.forEach(fid=>{
      const f = document.getElementById(fid);
      const vals = state.formDrafts[fid];
      if(!f || !vals) return;
      Object.keys(vals).forEach(n=>{
        const el = f.elements[n];
        if(!el || el.disabled || el.type==='file') return;
        if(el.type==='checkbox') el.checked = vals[n];
        else if(el.tagName==='SELECT'){ if(Array.from(el.options).some(o=>o.value===vals[n])) el.value = vals[n]; }
        else el.value = vals[n];
      });
      f.dataset.dirty = '1';
      const enc = f.elements['esEncomienda'];
      if(enc) aplicarModoEncomienda(f, enc.checked);
    });
    const fo = state._foco;
    if(fo){
      const f = document.getElementById(fo.fid);
      const el = f && f.elements[fo.name];
      if(el && el.focus){ el.focus(); try{ if(fo.sel && fo.sel[0]!=null) el.setSelectionRange(fo.sel[0], fo.sel[1]); }catch(e){} }
    }
  }
  // marca un formulario como "en edición" apenas el usuario escribe algo
  ['input','change'].forEach(evn=>document.addEventListener(evn, e=>{
    const f = e.target && e.target.form;
    if(f && FORMS_BORRADOR.includes(f.id)) f.dataset.dirty = '1';
  }, true));
  function aplicarModoEncomienda(f, on){
    f.querySelectorAll('.enc-box').forEach(b=>b.classList.toggle('oculto', !on));
    f.querySelectorAll('.solo-normal').forEach(b=>b.classList.toggle('oculto', on));
    f.querySelectorAll('.solo-normal input').forEach(i=>{ if(i.dataset.req) i.required = !on; });
    f.querySelectorAll('.enc-box [data-req]').forEach(i=>{ i.required = on; });
  }

  function renderDespachador(root){
    const tabs = [['nuevo','Nuevo pedido'],['ruta','Ruta de hoy'],['hist','Historial'],['visitas','Visitas técnicas'],['dist','Distribuidores'],['enc','Encomienda'],['cond','Conductores']];
    root.innerHTML = `<div class="app">
      ${topbar('Despachador')}
      <div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${state.tab===k?'active':''}" onclick="AppRuta.tab('${k}')">${l}</div>`).join('')}</div>
      <div class="panel" id="panel"></div>
    </div>`;
    const panel = $('#panel');
    if(state.tab==='nuevo') panel.innerHTML = viewNuevoPedido();
    else if(state.tab==='ruta') panel.innerHTML = viewRutaHoy();
    else if(state.tab==='hist') panel.innerHTML = viewHistorial();
    else if(state.tab==='visitas') panel.innerHTML = viewVisitas();
    else if(state.tab==='dist') panel.innerHTML = viewDistribuidores();
    else if(state.tab==='enc') panel.innerHTML = viewTransportes();
    else panel.innerHTML = viewConductores();
  }

  function camposEncomiendaHtml(p, ctx){
    const on = !!(p && p.esEncomienda);
    const bloqueado = p && estadoFinalizado(p.estadoEntrega);
    const dis = bloqueado ? 'disabled' : '';
    const transpOpts = `<option value="">Elegir transporte…</option>` + state.transportes.slice()
      .sort((a,b)=>transpLabel(a).localeCompare(transpLabel(b)))
      .map(t=>`<option value="${esc(t.id)}" ${p && p.transporteId===t.id?'selected':''}>${esc(transpLabel(t))}</option>`).join('');
    const pend = state.adjPendientes[ctx]||[];
    const pendHtml = pend.length ? `<div class="adj-list">${pend.map((a,i)=>`<div class="adj-item">⏳ <span class="n">${esc(a.nombre)}</span><span class="m">${fmtBytes(a.blob.size)} · por subir</span><button type="button" class="icon-btn" onclick="AppRuta.quitarPendiente('${ctx}',${i})">✕</button></div>`).join('')}</div>` : '';
    const v = (k)=> p ? esc(p[k]||'') : '';
    return `
      <label class="enc-toggle"><input type="checkbox" name="esEncomienda" ${on?'checked':''} ${dis} onchange="AppRuta.toggleEnc(this)"> 📦 Encomienda (envío a regiones por transporte)</label>
      <div class="enc-box ${on?'':'oculto'}">
        <h4>Datos de encomienda</h4>
        <div class="field-row">
          <div><label>Transporte (entrega inicial)</label><select name="transporteId" ${on?'required':''} data-req="1" ${dis}>${transpOpts}</select></div>
          <div><label>Dirección de entrega final</label><input type="text" name="encDireccionFinal" value="${v('encDireccionFinal')}" placeholder="Avda. Panorámica 1800, Coquimbo" ${on?'required':''} data-req="1" ${dis}></div>
        </div>
        <div class="field-row">
          <div><label>Nombre de quien recibe</label><input type="text" name="encRecibe" value="${v('encRecibe')}" ${dis}></div>
          <div><label>RUT</label><input type="text" name="encRut" value="${v('encRut')}" placeholder="12.345.678-9" ${dis}></div>
        </div>
        <div class="field-row">
          <div><label>Teléfono de quien recibe</label><input type="text" name="encTelefono" value="${v('encTelefono')}" placeholder="+569 1234 5678" ${dis}></div>
          <div><label>Adjuntos (factura, boleta, ficha de envío)</label>
            <input type="file" multiple accept=".pdf,.doc,.docx,image/*" onchange="AppRuta.elegirArchivos('${ctx}', this)">
          </div>
        </div>
        ${p ? adjuntosHtml(p, {quitar:true}) : ''}
        ${pendHtml}
        <div class="ro-note" style="margin:-4px 0 10px;">PDF, Word o imagen, máx. 700 KB c/u (las fotos se comprimen solas). Se borran automáticamente 2 días después de la fecha de entrega; los datos del pedido se conservan.</div>
      </div>`;
  }
  function datosEncomiendaDeForm(f){
    const on = f.esEncomienda && f.esEncomienda.checked;
    if(!on) return {esEncomienda:false};
    const t = byId(state.transportes, f.transporteId.value);
    return {
      esEncomienda: true,
      transporteId: f.transporteId.value,
      transporteNombre: t ? t.nombre : '',
      // la entrega del conductor es en la oficina del transporte
      direccionEntrega: t ? t.direccion : '',
      comunaEntrega: t ? t.comuna : '',

  function viewRutaHoy(){
    const grupos = {};
    grupos[''] = [];
    state.conductores.forEach(c=>grupos[c.id]=[]);
    state.pedidos.filter(p=>p.fecha===state.rutaFecha).forEach(p=>{
      const key = state.conductores.some(c=>c.id===p.conductorId) ? p.conductorId : '';
      if(!grupos[key]) grupos[key]=[];
      grupos[key].push(p);
    });

    let html = `<div class="ruta-controls">
      <div><label>Fecha</label><input type="date" value="${state.rutaFecha}" onchange="AppRuta.setFecha(this.value)"></div>
    </div>`;

    const orderKeys = [''].concat(state.conductores.map(c=>c.id));
    orderKeys.forEach(key=>{
      const nombre = key ? condNombre(key) : 'Sin asignar';
      const pedidosGrupo = grupos[key] || [];
      html += `<div class="group"><div class="group-head"><h3>${esc(nombre)}</h3><span class="count">${pedidosGrupo.length} pedido(s)</span></div>`;
      if(pedidosGrupo.length===0){
        html += `<div class="empty">Sin pedidos.</div></div>`;
        return;
      }
      if(!key){
        // sin asignar: solo mostrar selector de conductor por pedido, sin orden
        pedidosGrupo.forEach(p=>{
          html += renderPedidoSinAsignar(p);
        });
        html += `</div>`;
        return;
      }
      const legs = legsForConductorDay(key, state.rutaFecha);
      const badIds = invalidPedidoIds(legs);
      const mapsUrlDia = rutaMapsUrl(legs);
      html += `<div class="ruta-controls" style="margin-bottom:12px;">
        <span class="ro-note" style="margin:0;align-self:center;">Ordena con ▲▼ · opcional:</span>
        <button class="btn btn-ghost btn-small" onclick="AppRuta.ordenarComuna('${key}')">↕ Ordenar por comuna</button>
        ${mapsUrlDia ? `<a class="btn btn-ghost btn-small" href="${mapsUrlDia}" target="_blank" rel="noopener">🗺 Ver ruta completa en Maps</a>` : ''}
      </div>`;
      legs.forEach((leg, idx)=>{
        html += renderStopRow(leg, key, idx, legs.length, badIds.has(leg.pedido.id));
      });
      html += `</div>`;
    });
    return html;
  }

  function renderStopRow(leg, conductorId, idx, total, invalido){
    const p = leg.pedido;
    const esRetiro = leg.tipo==='RETIRO';
    const ent = entregaDe(p);
    const punto = esRetiro ? distNombre(p.distribuidorId) : (p.esEncomienda ? (ent.nombre+' (encomienda de '+(p.cliente||'')+')') : p.cliente);
    const dir = esRetiro ? distDireccion(p.distribuidorId) : ent.direccion;
    const comuna = esRetiro ? distComuna(p.distribuidorId) : ent.comuna;
    const contacto = esRetiro ? distContacto(p.distribuidorId) : ent.contacto;
    const tel = esRetiro ? distTelefono(p.distribuidorId) : ent.telefono;
    const doc = esRetiro ? p.documentoRetiro : p.documentoDespacho;
    const estadoCls = 'est-'+leg.estado.replace(/\s+/g,'-');
    const dot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${comunaColor(comuna)};margin-right:5px;"></span>`;
    return `<div class="stop" style="${invalido?'border-color:var(--problema);':''}">
      <div class="tag">${idx+1}</div>
      <div class="stop-body">
        <div class="stop-top">

  function visitasVisiblesHoy(conductorId, fecha){
    const esHoy = fecha === todayStr();
    const list = [];
    state.visitas.forEach(v=>{
      if((v.conductorId||'')!==conductorId) return;
      if(v.estado==='Anulado') return;
      const mismaFecha = v.fecha === fecha;
      const atrasada = esHoy && v.fecha < fecha && legNoFinalizado(v.estado);
      if(mismaFecha || atrasada) list.push(Object.assign({}, v, {atrasado: atrasada && !mismaFecha}));
    });
    list.sort((a,b)=>{
      if(a.atrasado!==b.atrasado) return a.atrasado ? -1 : 1;
      return (a.hora||'').localeCompare(b.hora||'');
    });
    return list;
  }

  function renderConductor(root){
    const hoy = todayStr();
    const fecha = state.drvFecha || hoy;
    const esHoy = fecha === hoy, pasado = fecha < hoy;
    const ro = !esHoy;
    const legs = legsForConductorDay(state.role.id, fecha).filter(l=>l.estado!=='Anulado');
    const visitas = visitasVisiblesHoy(state.role.id, fecha);
    const titulo = esHoy ? 'Tu ruta de hoy' : (pasado ? 'Ruta del día (pasado)' : 'Ruta programada');
    const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const [y,m,d] = fecha.split('-').map(Number);
    const diaNombre = dias[new Date(y,m-1,d).getDay()];
    const aviso = ro ? `<div class="banner" style="margin-top:12px;">${pasado
      ? '🔒 Día anterior: solo lectura. Lo que quedó pendiente aparece como "Atrasado" en tu ruta de hoy.'
      : '👁 Día futuro: solo lectura. Podrás marcar estados ese mismo día.'}</div>` : '';
    root.innerHTML = `<div class="app">
      ${topbar(state.role.nombre)}
      <div class="drv-head"><h2>${titulo}</h2><div class="sub">${diaNombre} ${fmtFechaCorta(fecha)} · ${legs.length} parada(s) · ${visitas.length} visita(s) técnica(s)</div>
        <div class="fecha-nav">
          <button class="icon-btn" title="Día anterior" onclick="AppRuta.drvDia(-1)">◀</button>
          <input type="date" value="${fecha}" onchange="AppRuta.drvFecha(this.value)">
          <button class="icon-btn" title="Día siguiente" onclick="AppRuta.drvDia(1)">▶</button>
          ${esHoy ? '' : '<button class="btn btn-ghost btn-small" onclick="AppRuta.drvFecha(\'\')">Volver a hoy</button>'}
        </div>
        ${aviso}
      </div>
      <div id="stops"></div>
      <div id="visitas-drv"></div>
    </div>`;
    const cont = $('#stops');
    if(legs.length===0){ cont.innerHTML = `<div class="empty">${esHoy ? 'Todavía no tienes paradas asignadas para hoy.' : 'Sin paradas para este día.'}</div>`; }
    else cont.innerHTML = legs.map((leg,idx)=>renderDriverStop(leg, idx, ro)).join('');
    const contV = $('#visitas-drv');
    if(visitas.length>0){
      contV.innerHTML = `<h3 style="margin:22px 0 10px;">Visitas técnicas</h3>` + visitas.map((v,idx)=>renderVisitaCardDrv(v, idx, ro)).join('');

    async quitarAdjunto(pid, aid){
      if(!await customConfirm('¿Quitar este adjunto? Se borra el archivo.')) return;
      const p = byId(state.pedidos, pid); if(!p) return;
      await db.doc('adjuntos/'+aid).delete().catch(()=>{});

    async abrirAdjunto(aid){
      // se abre la pestaña de inmediato (si no, el navegador la bloquea) y luego se carga el archivo
      const win = window.open('', '_blank');
      if(win) win.document.write('<p style="font-family:sans-serif">Cargando adjunto…</p>');
      try{
        const snap = await db.doc('adjuntos/'+aid).get();
        if(!snap.exists){ if(win) win.close(); await customAlert('Este adjunto ya fue eliminado.'); return; }
        const a = snap.data();
        const blob = await (await fetch(a.data)).blob();
        const url = URL.createObjectURL(blob);
        const visible = /pdf|image\//.test(a.tipo||'');
        if(visible && win){ win.location.href = url; }
        else {
          if(win) win.close();
          const el = document.createElement('a'); el.href = url; el.download = a.nombre || 'adjunto';
          document.body.appendChild(el); el.click(); el.remove();
        }
        setTimeout(()=>URL.revokeObjectURL(url), 60000);
      }catch(e){
        if(win) win.close();
        await customAlert('No se pudo abrir el adjunto. Revisa tu conexión.');
      }
    },

      const data = {

        distribuidorId:f.distribuidorId.value, documentoRetiro:f.documentoRetiro.value.trim(),

        conductorId:f.conductorId.value,
      };
      if(!estadoFinalizado(p.estadoEntrega)){
        Object.assign(data, datosEncomiendaDeForm(f));
      } else {

      // cambio de conductor o fecha: el pedido pasa al final de la nueva ruta
      if(data.conductorId && (data.conductorId!==p.conductorId || data.fecha!==p.fecha)){

      }
    },
    llamar(ev, tel){
      const url = telUrl(tel);
      try{
        if(window.top && window.top!==window){
          window.top.location.href = url;
          ev.preventDefault();
          return false;
        }
      }catch(e){ /* bloqueado por seguridad entre orígenes: deja que el link intente su navegación normal */ }
      return true;
    },
    async entrarClave(ev){
      ev.preventDefault();
      const val = ev.target.clave.value;
      if(val === CLAVE_COMPARTIDA){
        try{ localStorage.setItem('ecopisos_clave_ok','1'); }catch(e){}
        await bootApp();
      } else {
        document.getElementById('clave-error').textContent = 'Clave incorrecta.';
      }
      return false;
    },
  };

  // ---------- boot ----------
  function checkClave(){
    try{
      if(localStorage.getItem('ecopisos_clave_ok')==='1') return true;
    }catch(e){}
    return false;
  }
  function renderClaveGate(){
    const root = $('#root');
    root.innerHTML = `<div class="app"><div class="picker">
      <h1>Ruta del día</h1>
      <p class="sub">Ingresa la clave del equipo para continuar.</p>
      <form id="form-clave" onsubmit="return AppRuta.entrarClave(event)">
        <input type="password" name="clave" placeholder="Clave" style="margin-bottom:12px;" required>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Entrar</button>
        <div id="clave-error" style="color:var(--problema); font-size:13px; margin-top:10px;"></div>
      </form>
    </div></div>`;
  }
  async function boot(){
    if(!checkClave()){ renderClaveGate(); return; }
    await bootApp();
  }
  async function bootApp(){
    loadRole();
    applyUrlRole();
    render();
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){
      state.ready = true; db = null; render(); return;
    }
    state.ready = true;

    db.collection('distribuidores').onSnapshot(snap=>{
      state.distribuidores = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      state.distReady = true;
      seedIfEmpty();
      limpiarDuplicadoOmv();
      backfillCoords();
      render();
    }, ()=>{ state.distReady = true; render(); });

    db.collection('conductores').onSnapshot(snap=>{
      state.conductores = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      state.condReady = true;
      seedIfEmpty();
      applyUrlRole();
      render();
    }, ()=>{ state.condReady = true; render(); });

    db.collection('pedidos').onSnapshot(snap=>{
      state.pedidos = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
      if(state.role && state.role.type==='despachador') limpiarAdjuntosVencidos();
      if(!state._limpiezaTimer){ state._limpiezaTimer = setInterval(()=>{ limpiezaHecha=false; if(state.role && state.role.type==='despachador') limpiarAdjuntosVencidos(); }, 6*3600*1000); }
    }, ()=>{ render(); });

    db.collection('transportes').onSnapshot(snap=>{
      state.transportes = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      state.transpReady = true;
      seedIfEmpty();
      render();
    }, ()=>{ state.transpReady = true; render(); });

    db.collection('visitas').onSnapshot(snap=>{
      state.visitas = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    }, ()=>{ render(); });

    render();
  }
  boot();
})();
</script>
</body>
</html>
